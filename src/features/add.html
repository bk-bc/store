<div id="add" class="section">
    <h3>新增資料</h3>
    <div class="nav-buttons" style="margin-bottom: 10px;">
        <button onclick="switchAddMode('normal')" id="addModeNormal" class="active">一般新增</button>
        <button onclick="switchAddMode('price')" id="addModePrice">加價格</button>
        <button onclick="switchAddMode('barcode')" id="addModeBarcode">新條碼</button>
        <button onclick="switchAddMode('file')" id="addModeFile">建檔</button>
        <button onclick="switchAddMode('fresh')" id="addModeFresh">鮮食建檔</button>
    </div>
    <div id="addNormalPanel">
        <select id="addType">
            <option value="EAN8">EAN8</option><option value="EAN13">EAN13</option>
            <option value="UPCA">UPCA</option><option value="UPCE">UPCE</option>
            <option value="I35">I35</option><option value="I24">I24</option>
        </select>
        <textarea id="addInput" rows="6" placeholder="請輸入資料，每行格式：ID/Name"></textarea>
        <button class="btn-primary" onclick="addItems()" style="width: 100%;">新增</button>
    </div>
    <div id="addPricePanel" style="display:none;">
        <select id="addPriceType">
            <option value="EAN8">EAN8</option><option value="EAN13">EAN13</option>
            <option value="UPCA">UPCA</option><option value="UPCE">UPCE</option>
            <option value="I35">I35</option><option value="I24">I24</option>
        </select>
        <textarea id="addPriceInput" rows="6" placeholder="請輸入資料，每行格式：ID/Name/Price"></textarea>
        <button class="btn-primary" onclick="addItemsWithPrice()" style="width: 100%;">新增</button>
    </div>
    <div id="addBarcodePanel" style="display:none;">
        <textarea id="addBarcodeInput" rows="6" placeholder="每行輸入一個新 ID"></textarea>
        <button class="btn-primary" onclick="addNewBarcodes()" style="width: 100%;">新增</button>
        <div id="addBarcodeStatus" class="qa-add-status"></div>
    </div>
    <div id="addFilePanel" style="display:none;">
        <div id="addFileResult"></div>
    </div>
    <div id="addFreshPanel" style="display:none;">
        <input type="text" id="addFreshNameInput" placeholder="輸入鮮食名稱，前六字需為數字" oninput="renderFreshBarcodePreview()">
        <div class="card">
            <div class="card-title" id="addFreshIdPreview">尚未產生 ID</div>
            <div class="barcode-wrapper"><svg id="addFreshBarcode" class="barcode"></svg></div>
        </div>
        <div class="nav-buttons" style="margin-bottom: 10px;">
            <button onclick="selectFreshType('I24')" id="addFreshTypeI24" class="active">I24</button>
            <button onclick="selectFreshType('I35')" id="addFreshTypeI35">I35</button>
        </div>
        <button class="btn-primary" onclick="addFreshItem()" style="width: 100%;">新增</button>
        <div id="addFreshStatus" class="qa-add-status"></div>
    </div>
</div>
